name: Scratch
on:
  push:
  workflow_dispatch:
jobs:
  my-job:
    runs-on: windows-latest
    steps:
      - shell: bash
        run: ls -Al /c/Users/runneradmin/
      - name: Update git for windows
        if: runner.os == 'Windows'
        run: sh -x /mingw64/bin/git-update-git-for-windows
        shell: pwsh
        env:
          GIT_TRACE: 1
